name: arc-runner-stress-test

on:
  workflow_dispatch:

jobs:
  stress_load:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - worker: 1
            runner: arc-runner-dotnet
          - worker: 2
            runner: arc-runner-react
          - worker: 3
            runner: arc-runner-dotnet
          - worker: 4
            runner: arc-runner-react
          - worker: 5
            runner: arc-runner-dotnet
          - worker: 6
            runner: arc-runner-react
          - worker: 7
            runner: arc-runner-dotnet
          - worker: 8
            runner: arc-runner-react
          - worker: 9
            runner: arc-runner-dotnet
          - worker: 10
            runner: arc-runner-react
          - worker: 11
            runner: arc-runner-dotnet
          - worker: 12
            runner: arc-runner-react
          - worker: 13
            runner: arc-runner-dotnet
          - worker: 14
            runner: arc-runner-react
          - worker: 15
            runner: arc-runner-dotnet
          - worker: 16
            runner: arc-runner-react
          - worker: 17
            runner: arc-runner-dotnet
          - worker: 18
            runner: arc-runner-react
          - worker: 19
            runner: arc-runner-dotnet
          - worker: 20
            runner: arc-runner-react

    runs-on: ${{ matrix.runner }}

    steps:
      - name: CPU stress (worker ${{ matrix.worker }})
        run: |
          echo "Worker ${{ matrix.worker }} on runner $(hostname)"
          for i in {1..30}; do
            dd if=/dev/zero bs=10M count=10 2>/dev/null | sha256sum >/dev/null
          done
