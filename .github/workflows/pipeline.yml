name: App Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'
      - 'README*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # ── 1. Build & Test ────────────────────────────────────────────────────────
  build:
    name: .NET Build & Test
    uses: org-test-reply-1/platform-workflows/.github/workflows/ci-dotnet.yml@fb5f08ef77d9680d62ac7d2a2a8020ce325ebec4
    with:
      project-path: "samples/dotnetapp"
      run-tests: true
      runner: arc-runner-set

# ── 2. Se fallisce → triggera failure handler immediatamente ───────────────
  on-failure:
    name: Trigger Failure Handler
    needs: build
    if: failure()
    uses: org-test-reply-1/platform-ai-workflows/.github/workflows/ai-failure-handler.yml@a87037605c174207eab693e2a868d5b7712a63bb
    permissions:
      contents: read
      issues: write
    with:
      target-repo: ${{ github.repository }}
    secrets:
      COPILOT_ASSIGN_PAT: ${{ secrets.COPILOT_ASSIGN_PAT }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
