name: App Pipeline
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'
      - 'README*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: .NET Build & Test
    uses: org-test-reply-1/platform-workflows/.github/workflows/ci-dotnet.yml@main
    with:
      project-path: "samples/dotnetapp"
      run-tests: true
      runner: arc-runner-set
  on-failure:
    name: Trigger Failure Handler
    needs: build
    if: failure()
    permissions:
      contents: read
      actions: read
      issues: write
    uses: org-test-reply-1/platform-ai-workflows/.github/workflows/ai-failure-handler.yml@main
    with:
      target-repo: ${{ github.repository }}
      failed-run-id: ${{ github.run_id }}
    secrets:
      COPILOT_ASSIGN_PAT: ${{ secrets.COPILOT_ASSIGN_PAT }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
